<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Styling with Box Dimensions</title>
  <style>
    .boxed-element {
      border: 2px solid black;
      width: 200px;
      height: 100px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h2 class="boxed-element">Boxed Heading</h2>

  <div class="boxed-element">
    This is a styled box using the <code>.boxed-element</code> class. It has a fixed size and a border.
  </div>

</body>
</html>
